name: Build Open DStroke for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test application logic
        run: python -m unittest discover -s tests -v
      - name: Test the Windows UI
        env:
          APPDATA: ${{ runner.temp }}\OpenDStroke-test
        run: python tests/ui_smoke.py
      - name: Install EXE builder
        run: python -m pip install pyinstaller
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean OpenDStroke.spec
      - name: Build installer
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler OpenDStroke.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDStroke-Windows-x64
          path: |
            dist/OpenDStroke.exe
            dist/OpenDStroke-Setup.exe
